aliases:
  auto:
    spread: 4
    prefer:
    - explabs/gpt-6-astra
    - explabs/claude-fable-5.1
    - antigravity/claude-opus-4-6-thinking
    - zai/glm-4.5-flash
    - ollama/qwen3:30b-a3b-instruct-2507-q4_K_M
  vision:
    spread: 4
    require:
    - vision
    prefer:
    - explabs/gpt-6-astra
    - explabs/claude-fable-5.1
    - dashscope/qwen3-vl-plus
    - zai/glm-4.6v-flash
    - ollama/gemma3:27b
  fast:
    spread: 4
    require:
    - text
    prefer:
    - zai/glm-4.5-flash
  strong:
    spread: 3
    require:
    - text
    prefer:
    - antigravity/claude-opus-4-6-thinking
    - antigravity/claude-sonnet-4-6
    - antigravity/gemini-3.1-pro-high
    - explabs/gpt-6-astra
    - explabs/claude-fable-5.1
  local:
    prefer:
    - ollama/qwen3:30b-a3b-instruct-2507-q4_K_M
    - ollama/gemma3:27b
  # long inputs, strict JSON, verbatim quoting; the app reserves 4000 out tokens per call
  extract:
    spread: 3
    require:
    - text
    - json
    min_context: 24000
    avoid:
    - reasoning
    max_latency_ms: 30000
    prefer:
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-3.8-flash
    - explabs/gpt-6-astra
    - explabs/claude-fable-5.1
    - cohere/command-a-plus-05-2026
    - zai/glm-4.5-flash
    - openrouter/google/gemma-4-31b-it:free
  copilot:
    spread: 1
    require:
    - text
    prefer:
    - copilot/auto
    - copilot/claude-opus-5
    - copilot/claude-sonnet-4.6
    - copilot/claude-haiku-4.5
    - copilot/gpt-5.6-sol
    - copilot/gemini-3.8-flash
