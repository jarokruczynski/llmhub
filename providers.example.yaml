      - reasoning
      free: {}
    - id: claude-sonnet-4-6
      caps:
      - text
      - json
      - reasoning
      free: {}
    - id: claude-opus-4-6-thinking
      caps:
      - text
      - json
      - reasoning
      free: {}
    - id: gpt-oss-120b-medium
      caps:
      - text
      - json
      - reasoning
      free: {}
  copilot:
    kind: cli
    command: copilot
    timeout_s: 240
    env_passthrough:
    - HOME
    - PATH
    - LANG
    extra_args: []
    env_deny:
    - GITHUB_TOKEN
    - GH_TOKEN
    - COPILOT_GITHUB_TOKEN
    - COPILOT_ALLOW_ALL
    docs_url: https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli
    template: copilot
    notes: a Copilot seat that is not the owner's to spend freely, not a free tier - the seat
      holder sees usage and audit logs, so do not route private-project traffic here
    accounts:
    - id: copilot-main
